name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: python -m pip install -e ".[dev]"

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean AnkiVocabApp.spec

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/AnkiVocabApp.exe" --generate-notes --title "Anki Vocab App ${{ github.ref_name }}"
