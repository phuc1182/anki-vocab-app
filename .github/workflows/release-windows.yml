name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: python -m pip install -e ".[dev]"

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean AnkiVocabApp.spec

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $release = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Anki Vocab App $tag"
          } else {
            gh release create $tag --generate-notes --title "Anki Vocab App $tag"
          }
          gh release upload $tag "dist/AnkiVocabApp.exe" --clobber
